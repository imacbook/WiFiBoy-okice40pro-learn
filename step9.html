<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step9 動畫 — 共陰 / 共陽切換</title>
<style>
  :root{--bg:#0b1020;--line:#263352;--text:#dce6ff;--dim:#8fa0c4;--accent:#ffd54a;--green:#38e07b;--cyan:#3ad0e6;--red:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16213d 0%,var(--bg) 55%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .chapters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chapters button{border:1px solid var(--line);background:#121c33;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chapters button:hover{border-color:#3a4a72;background:#16223d}
  .chapters button.on{background:linear-gradient(180deg,#2a3c66,#1d2c4d);border-color:#4a6396;
    box-shadow:0 0 0 1px #4a639655,0 6px 18px #0a1228}
  .scene{background:linear-gradient(180deg,#0d1526,#0a101d);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #05080f, inset 0 1px 0 #ffffff08}
  svg{display:block;width:100%;height:auto}
  .narration{margin-top:12px;background:#0e1628;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:74px;font-size:14px;line-height:1.75}
  .narration b{color:var(--accent)}
  .narration code{background:#1a2540;padding:1px 6px;border-radius:5px;color:#ffd88a;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{background:#16223d;border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .nav .spacer{flex:1}
  .lbl{font-size:13px;fill:var(--dim)}
  .lbl-strong{font-size:15px;fill:var(--text);font-weight:600}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .chip{fill:#16233c;stroke:#3d5480;stroke-width:2}
  .plate{fill:#0d1526;stroke:#2c3a5c}
  .seg{fill:#1b2740;stroke:#2c3a5c;stroke-width:1.5;transition:fill .2s,filter .2s}
  .pwire{fill:#222e49;transition:fill .15s,filter .15s}
  .pwire.on{fill:var(--accent);filter:drop-shadow(0 0 6px #ffd54a)}
  .seg.lit{fill:var(--accent);stroke:#ffe89a;filter:drop-shadow(0 0 10px #ffd54a)}
  .hl-box{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
  .hl-box.on{opacity:1}
  .big{font-size:24px;font-weight:800;fill:var(--accent);font-family:"SF Mono",Menlo,monospace;text-anchor:middle}
  .led{fill:#1b2740;stroke:#2c3a5c;transition:fill .12s}
  .led.on{fill:var(--green);stroke:#7dffb0;filter:drop-shadow(0 0 8px #38e07b)}
  .pill{fill:#0d1526;stroke:#2c3a5c}
  .pill.on{fill:#123a2a;stroke:var(--green)}

  /* ==== 返回主頁按鈕 ==== */
  .back-home{position:fixed;top:14px;right:18px;z-index:9999;
    display:inline-flex;align-items:center;gap:6px;
    background:#16223d;color:#dce6ff;text-decoration:none;
    padding:9px 16px;border-radius:10px;font-size:13px;
    border:1px solid #263352;font-family:inherit;
    box-shadow:0 6px 20px #05080f;transition:.2s}
  .back-home:hover{background:#1e2c4d;border-color:#4a6396;color:#fff;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>step9 動畫 — 共陰 / 共陽切換</h1>
  <div class="sub">
    同一份程式，怎麼支援兩種極性的顯示器？靠一個 <code>parameter</code> 切換。<br>
    路徑：<b>parameter → 段碼反相 → 位數致能反相 → 兩種都能正常顯示</b>
  </div>

  <div class="chapters" id="chapters">
    <button data-ch="1" class="on">① 兩種極性</button>
    <button data-ch="2">② parameter</button>
    <button data-ch="3">③ 段碼反相</button>
    <button data-ch="4">④ 位數致能反相</button>
    <button data-ch="5">⑤ 完整</button>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 530" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a48"/><stop offset="1" stop-color="#121d33"/>
        </linearGradient>
      </defs>

      <!-- 程式碼 -->
      <g id="gCode">
        <rect x="20" y="60" width="330" height="340" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="40" y="88" class="lbl-strong">step9 程式碼</text>
        <text x="40" y="118" class="mono" style="font-size:12px" fill="#9fd4ff">module seven_seg_polarity #(</text>
        <text x="52" y="140" class="mono" style="font-size:12px" fill="#ffd54a">parameter COMMON_ANODE = 0</text>
        <text x="40" y="162" class="mono" style="font-size:12px" fill="#9fd4ff">)( ... );</text>

        <line x1="40" y1="178" x2="320" y2="178" stroke="#2c3a5c"/>

        <text x="40" y="202" class="mono" style="font-size:12px" fill="#9fd4ff">// 段碼：共陽要反相</text>
        <text x="40" y="224" class="mono" style="font-size:12px" fill="#9fd4ff">seg = COMMON_ANODE</text>
        <text x="64" y="246" class="mono" style="font-size:12px" fill="#9fd4ff">? ~seg_pattern</text>
        <text x="64" y="268" class="mono" style="font-size:12px" fill="#9fd4ff">: seg_pattern;</text>

        <text x="40" y="296" class="mono" style="font-size:12px" fill="#9fd4ff">// 位數：共陽高電位致能</text>
        <text x="40" y="318" class="mono" style="font-size:12px" fill="#9fd4ff">dig1 = COMMON_ANODE</text>
        <text x="64" y="340" class="mono" style="font-size:12px" fill="#9fd4ff">? ~cur_dig : cur_dig;</text>

        <text x="40" y="372" class="lbl" style="font-size:11px;fill:#ffd54a">改一行參數，兩種硬體都能用</text>
      </g>

      <!-- FPGA -->
      <g id="gFpga">
        <rect x="380" y="60" width="230" height="340" rx="16" fill="url(#gChip)" class="chip"/>
        <text x="495" y="88" text-anchor="middle" class="lbl-strong">FPGA</text>

        <text x="400" y="122" class="lbl" style="font-size:11px">COMMON_ANODE</text>
        <rect id="caBox" class="plate" x="400" y="132" width="56" height="30" rx="7"/>
        <text id="caVal" x="428" y="153" class="big" style="font-size:18px">0</text>
        <text id="caName" x="470" y="153" class="lbl" style="font-size:11px;fill:#38e07b">共陰</text>

        <text x="400" y="192" class="lbl" style="font-size:11px">原始段碼（數字 3）</text>
        <text x="495" y="213" text-anchor="middle" class="mono" style="font-size:13px" fill="#9fd4ff">1111001</text>

        <text x="400" y="242" class="lbl" style="font-size:11px">實際輸出 seg</text>
        <text id="outSeg" x="495" y="263" text-anchor="middle" class="mono" style="font-size:13px;fill:#ffd54a">1111001</text>

        <text x="400" y="292" class="lbl" style="font-size:11px">dig1 輸出</text>
        <text id="outDig" x="495" y="313" text-anchor="middle" class="mono" style="font-size:13px;fill:#ffd54a">0</text>
        <text id="digMean" x="495" y="334" text-anchor="middle" class="lbl" style="font-size:11px">（0 = 致能）</text>

        <text x="495" y="366" text-anchor="middle" class="lbl" style="font-size:11px;fill:#38e07b">兩種極性 → 顯示器都顯示 3</text>
      </g>

      <!-- 顯示器 -->
      <g id="gDisp">
        <rect x="680" y="60" width="400" height="340" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="880" y="88" text-anchor="middle" class="lbl-strong" style="font-size:13px">7 段顯示器（顯示 3）</text>

        <g id="segs">
          <rect id="segA" class="seg" x="775" y="140" width="80" height="11" rx="3"/>
          <rect id="segB" class="seg" x="855" y="151" width="11" height="80" rx="3"/>
          <rect id="segC" class="seg" x="855" y="241" width="11" height="80" rx="3"/>
          <rect id="segD" class="seg" x="775" y="321" width="80" height="11" rx="3"/>
          <rect id="segE" class="seg" x="764" y="241" width="11" height="80" rx="3"/>
          <rect id="segF" class="seg" x="764" y="151" width="11" height="80" rx="3"/>
          <rect id="segG" class="seg" x="775" y="231" width="80" height="11" rx="3"/>
        </g>

        <rect id="digBox1" class="led" x="790" y="348" width="34" height="12" rx="4"/>
        <text x="807" y="376" text-anchor="middle" class="lbl" style="font-size:10px">dig1</text>
        <rect id="digBox2" class="led" x="835" y="348" width="34" height="12" rx="4"/>
        <text x="852" y="376" text-anchor="middle" class="lbl" style="font-size:10px">dig2</text>

        <text id="polarTxt" x="880" y="330" text-anchor="middle" class="lbl" style="font-size:12px;fill:#38e07b">共陰：段 1 = 亮</text>
      </g>

      <rect id="hlCode" x="20" y="60" width="330" height="340" rx="14" class="hl-box"/>
      <rect id="hlFpga" x="380" y="60" width="230" height="340" rx="16" class="hl-box"/>
      <rect id="hlDisp" x="680" y="60" width="400" height="340" rx="14" class="hl-box"/>
    
      <!-- ==== PMOD 訊號列（有訊號的線會亮） ==== -->
      <g id="gPmod">
        <text x="550" y="478" text-anchor="middle" class="lbl" style="font-size:11px">PMOD 排線（實際輸出電位；共陽時 0 才亮）</text>
        <g id="pmodRow">
          <rect id="pa" class="pwire" x="210" y="490" width="95" height="11" rx="3"/>
          <text x="257" y="516" text-anchor="middle" class="lbl" style="font-size:9px">a</text>
          <rect id="pb" class="pwire" x="315" y="490" width="95" height="11" rx="3"/>
          <text x="362" y="516" text-anchor="middle" class="lbl" style="font-size:9px">b</text>
          <rect id="pc" class="pwire" x="420" y="490" width="95" height="11" rx="3"/>
          <text x="467" y="516" text-anchor="middle" class="lbl" style="font-size:9px">c</text>
          <rect id="pd" class="pwire" x="525" y="490" width="95" height="11" rx="3"/>
          <text x="572" y="516" text-anchor="middle" class="lbl" style="font-size:9px">d</text>
          <rect id="pe" class="pwire" x="630" y="490" width="95" height="11" rx="3"/>
          <text x="677" y="516" text-anchor="middle" class="lbl" style="font-size:9px">e</text>
          <rect id="pf" class="pwire" x="735" y="490" width="95" height="11" rx="3"/>
          <text x="782" y="516" text-anchor="middle" class="lbl" style="font-size:9px">f</text>
          <rect id="pg" class="pwire" x="840" y="490" width="95" height="11" rx="3"/>
          <text x="887" y="516" text-anchor="middle" class="lbl" style="font-size:9px">g</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="narration" id="narr"></div>
  <div class="hint">用上方按鈕切換章節（或 ← → 鍵；也可點「切換極性」按鈕）。</div>
  <div class="nav">
    <button id="prev">← 上一章</button>
    <button id="toggle">切換極性 (0/1)</button>
    <div class="spacer"></div>
    <button id="next">下一章 →</button>
  </div>
</div>

<script>
(function(){
  const CH = 5; let cur = 1;
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  const PATTERN = '1111001';   // 數字 3 的原始段碼
  const SEG_IDS = ['segA','segB','segC','segD','segE','segF','segG'];
  let commonAnode = 0;   // 0 = 共陰, 1 = 共陽

  function invertBits(s){ return s.split('').map(c=>c==='1'?'0':'1').join(''); }

  
  // 更新 PMOD 訊號列（code = 'a b c d e f g' 的 7-bit 字串）
  function updatePmod(code){
    const ids = ['pa','pb','pc','pd','pe','pf','pg'];
    ids.forEach((id,i)=> $('#'+id).classList.toggle('on', code && code[i]==='1'));
  }

  function render(){
    const outSeg = commonAnode ? invertBits(PATTERN) : PATTERN;
    // 顯示器：把「實際要亮」的段點亮（共陽時，輸出 0 = 亮 → 要反過來看）
    const litMask = commonAnode ? invertBits(outSeg) : outSeg;
    SEG_IDS.forEach((id,i)=> $('#'+id).classList.toggle('lit', litMask[i]==='1'));

    $('#caVal').textContent = commonAnode;
    $('#caName').textContent = commonAnode ? '共陽' : '共陰';
    $('#caName').setAttribute('style','font-size:11px;fill:' + (commonAnode ? '#ffd54a' : '#38e07b'));
    $('#outSeg').textContent = outSeg;
    $('#outDig').textContent = commonAnode ? '1' : '0';
    $('#digMean').textContent = commonAnode ? '（1 = 致能）' : '（0 = 致能）';
    $('#polarTxt').textContent = commonAnode ? '共陽：段 0 = 亮' : '共陰：段 1 = 亮';
    $('#digBox1').classList.toggle('on', true);
    updatePmod(outSeg);
  }

  function setChapter(n){
    cur = Math.max(1,Math.min(CH,n));
    $$('#chapters button').forEach(b=>b.classList.toggle('on', +b.dataset.ch===cur));
    $$('.hl-box').forEach(e=>e.classList.remove('on'));
    if(cur>=1) $('#hlCode').classList.add('on');
    if(cur>=2) $('#hlFpga').classList.add('on');
    if(cur>=3) $('#hlDisp').classList.add('on');
    if(cur>=5){ $('#hlCode').classList.add('on'); $('#hlFpga').classList.add('on'); $('#hlDisp').classList.add('on'); }
    $('#narr').innerHTML = narrative[cur];
  }

  const narrative = {
    1: `<b>① 兩種極性</b>：<b>共陰</b>：共腳接地，段給 1 亮、位數給 0 致能。
        <b>共陽</b>：共腳接 VCC，段給 0 亮、位數給 1 致能。
        兩種的「亮/致能」邏輯剛好相反。`,
    2: `<b>② parameter</b>：<code>parameter COMMON_ANODE = 0</code> 是編譯時決定的設定。
        改一個數字，就能切換兩種硬體，不用改程式邏輯。`,
    3: `<b>③ 段碼反相</b>：<code>seg = COMMON_ANODE ? ~seg_pattern : seg_pattern;</code>
        共陽時把整組段碼反相（1 變 0、0 變 1），因為共陽是「0 才亮」。`,
    4: `<b>④ 位數致能反相</b>：<code>dig1 = COMMON_ANODE ? ~cur_dig : cur_dig;</code>
        共陰是「0 致能」、共陽是「1 致能」，所以位數也要反相。`,
    5: `<b>⑤ 完整</b>：同一份程式，改 <code>COMMON_ANODE</code> 就能同時支援共陰/共陽。
        不管哪一種，顯示器都顯示同樣的數字（3）。`
  };

  // 自動切換（每 2.5 秒）
  setInterval(()=>{
    commonAnode = commonAnode ? 0 : 1;
    render();
  }, 2500);

  $('#toggle').addEventListener('click', ()=>{ commonAnode = commonAnode ? 0 : 1; render(); });

  $$('#chapters button').forEach(b=>b.addEventListener('click', ()=>setChapter(+b.dataset.ch)));
  $('#prev').addEventListener('click', ()=>setChapter(cur-1));
  $('#next').addEventListener('click', ()=>setChapter(cur+1));
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') setChapter(cur-1);
    if(e.key==='ArrowRight') setChapter(cur+1);
  });

  const params = new URLSearchParams(location.search);
  const start = parseInt(params.get('ch')||'1',10);
  setChapter(isNaN(start)?1:start);
  render();
})();
</script>
<a href="index.html" class="back-home">← 返回主頁</a>
</body>
</html>
