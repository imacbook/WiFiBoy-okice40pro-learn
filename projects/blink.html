<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>閃燈（blink）</title>
<style>
  :root{--bg:#0b1020;--line:#263352;--text:#dce6ff;--dim:#8fa0c4;--accent:#ffd54a;--green:#38e07b;--cyan:#3ad0e6}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16213d 0%,var(--bg) 55%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .chapters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chapters button{border:1px solid var(--line);background:#121c33;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chapters button:hover{border-color:#3a4a72;background:#16223d}
  .chapters button.on{background:linear-gradient(180deg,#2a3c66,#1d2c4d);border-color:#4a6396;
    box-shadow:0 0 0 1px #4a639655,0 6px 18px #0a1228}
  .scene{background:linear-gradient(180deg,#0d1526,#0a101d);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #05080f, inset 0 1px 0 #ffffff08}
  svg{display:block;width:100%;height:auto}
  .narration{margin-top:12px;background:#0e1628;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:74px;font-size:14px;line-height:1.75}
  .narration b{color:var(--accent)}
  .narration code{background:#1a2540;padding:1px 6px;border-radius:5px;color:#ffd88a;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{background:#16223d;border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .nav .spacer{flex:1}
  .back-home{position:fixed;top:14px;right:18px;z-index:9999;display:inline-flex;align-items:center;gap:6px;
    background:#16223d;color:#dce6ff;text-decoration:none;padding:9px 16px;border-radius:10px;font-size:13px;
    border:1px solid #263352;font-family:inherit;box-shadow:0 6px 20px #05080f;transition:.2s}
  .back-home:hover{background:#1e2c4d;border-color:#4a6396;color:#fff}
  .lbl{font-size:13px;fill:var(--dim)}
  .lbl-strong{font-size:15px;fill:var(--text);font-weight:600}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .hl-box{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
  .hl-box.on{opacity:1}
  .wave-card{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#0e1628}
  .wave-title{font-size:12px;color:var(--dim);margin-bottom:10px}
  .wave-card img{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);
    background:#0b1220;margin-bottom:10px}
  .wave-card img:last-child{margin-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>閃燈（blink）</h1>
  <div class="sub">用 Verilog 計數器讓 LED 週期性閃爍，並用 testbench 模擬驗證。</div>
  <div class="chapters" id="chapters"><button data-ch="1" class="on">① 目的</button><button data-ch="2">② 程式</button><button data-ch="3">③ 波形</button><button data-ch="4">④ 結果</button></div>
  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg">
      <g id="gCode"><rect x="20" y="60" width="330" height="340" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/><text x="40" y="88" class="lbl-strong">程式碼</text><text x="40" y="118" class="mono" style="font-size:10.5px" fill="#9fd4ff">// blink_tb.v（testbench）</text><text x="40" y="135" class="mono" style="font-size:10.5px" fill="#9fd4ff"></text><text x="40" y="152" class="mono" style="font-size:10.5px" fill="#9fd4ff">reg clk = 0;</text><text x="40" y="169" class="mono" style="font-size:10.5px" fill="#9fd4ff">always #5 clk = ~clk;</text><text x="40" y="186" class="mono" style="font-size:10.5px" fill="#9fd4ff"></text><text x="40" y="203" class="mono" style="font-size:10.5px" fill="#9fd4ff">wire led;</text><text x="40" y="220" class="mono" style="font-size:10.5px" fill="#9fd4ff">blink dut(.clk(clk), .led(led));</text><text x="40" y="237" class="mono" style="font-size:10.5px" fill="#9fd4ff"></text><text x="40" y="254" class="mono" style="font-size:10.5px" fill="#9fd4ff">initial begin</text><text x="40" y="271" class="mono" style="font-size:10.5px" fill="#9fd4ff">  $dumpfile("blink.vcd");</text><text x="40" y="288" class="mono" style="font-size:10.5px" fill="#9fd4ff">  $dumpvars(0, blink_tb);</text><text x="40" y="305" class="mono" style="font-size:10.5px" fill="#9fd4ff">  #1000000 $finish;</text><text x="40" y="322" class="mono" style="font-size:10.5px" fill="#9fd4ff">end</text></g>
      <g id="gLed"><rect x="380" y="60" width="300" height="340" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="530" y="88" text-anchor="middle" class="lbl-strong" style="font-size:13px">LED 閃爍</text>
        <circle id="led" cx="530" cy="220" r="55" fill="#ff3333" style="filter:drop-shadow(0 0 30px #ff3333)"/>
        <text id="ledTxt" x="530" y="300" text-anchor="middle" class="lbl" style="font-size:13px;fill:#ffd54a">ON</text>
        <text x="530" y="330" text-anchor="middle" class="lbl" style="font-size:11px">12MHz 除頻 → 每秒切換</text></g>
      <g id="gWave"><rect x="710" y="60" width="370" height="340" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="895" y="88" text-anchor="middle" class="lbl-strong" style="font-size:13px">testbench 驗證</text>
        <text x="895" y="150" text-anchor="middle" class="lbl" style="font-size:12px">1. testbench 產生時鐘</text>
        <text x="895" y="180" text-anchor="middle" class="lbl" style="font-size:12px">2. iverilog 編譯 + vvp 執行</text>
        <text x="895" y="210" text-anchor="middle" class="lbl" style="font-size:12px">3. 產生 .vcd 波形檔</text>
        <text x="895" y="240" text-anchor="middle" class="lbl" style="font-size:12px">4. GTKWave 看波形</text>
        <text x="895" y="290" text-anchor="middle" class="lbl" style="font-size:11px;fill:#38e07b">下方有實際波形圖</text></g>
      <rect id="hlCode" x="20" y="60" width="330" height="340" rx="14" class="hl-box"/>
      <rect id="hlLed" x="380" y="60" width="300" height="340" rx="14" class="hl-box"/>
      <rect id="hlWave" x="710" y="60" width="370" height="340" rx="14" class="hl-box"/>
    </svg>
  </div>
  <div class="wave-card"><div class="wave-title">實際波形（iverilog + GTKWave，上方 clk、下方 led）</div><img src="../code/blink/blink_wave_full.png" alt="blink 波形（全景）" loading="lazy"><img src="../code/blink/blink_wave_zoom.png" alt="blink 波形（放大）" loading="lazy"></div>
  <div class="narration" id="narr"></div>
  <div class="hint">用上方按鈕切換章節（或 ← → 鍵）。</div>
  <div class="nav">
    <button id="prev">← 上一章</button>
    <div class="spacer"></div>
    <button id="next">下一章 →</button>
  </div>
</div>
<a href="../index.html?pmod=projects" class="back-home">← 返回主頁</a>
<script>
(function(){
  var CH = 4; var cur = 1;
  var $ = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return document.querySelectorAll(s); };
  var NARR = ["<b>① 目的</b>：最基本的第一支程式——讓 LED 一閃一閃。用 12MHz 計數器除頻，每秒切換一次。", "<b>② 程式</b>：testbench 產生時鐘、接上待測物、跑 1ms、產生 <code>.vcd</code> 波形。", "<b>③ 波形</b>：下方是真實的 GTKWave 波形——<code>clk</code> 很快、<code>led</code> 慢很多（除頻後）。", "<b>④ 結果</b>：模擬通過後，就可以燒到板子看 LED 閃爍。"];
  function setChapter(n){
    cur = Math.max(1, Math.min(CH, n));
    $$('#chapters button').forEach(function(b){ b.classList.toggle('on', +b.dataset.ch===cur); });
    $$('.hl-box').forEach(function(e){ e.classList.remove('on'); });
    if(cur>=1) $('#hlCode').classList.add('on');
    if(cur>=2) { var ids2=['#hlLed','#hlLcd','#hlArch']; ids2.forEach(function(id){ var e=$(id); if(e) e.classList.add('on'); }); }
    if(cur>=3) { var ids3=['#hlWave','#hlInfo','#hlBoard']; ids3.forEach(function(id){ var e=$(id); if(e) e.classList.add('on'); }); }
    if(cur>=4) { var ids4=['#hlLed','#hlLcd','#hlArch','#hlWave','#hlInfo','#hlBoard']; ids4.forEach(function(id){ var e=$(id); if(e) e.classList.add('on'); }); }
    $('#narr').innerHTML = NARR[cur-1];
  }
  $$('#chapters button').forEach(function(b){ b.addEventListener('click', function(){ setChapter(+b.dataset.ch); }); });
  $('#prev').addEventListener('click', function(){ setChapter(cur-1); });
  $('#next').addEventListener('click', function(){ setChapter(cur+1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft') setChapter(cur-1);
    if(e.key==='ArrowRight') setChapter(cur+1);
  });
  var params = new URLSearchParams(location.search);
  var start = parseInt(params.get('ch')||'1',10);
  setChapter(isNaN(start)?1:start);
  let on = true;
  setInterval(function(){ on=!on; var e=document.getElementById('led'); var t=document.getElementById('ledTxt');
    if(e){ e.setAttribute('fill', on?'#ff3333':'#3a1414'); e.style.filter = on?'drop-shadow(0 0 30px #ff3333)':'none'; }
    if(t){ t.textContent = on?'ON':'OFF'; t.setAttribute('style','font-size:13px;fill:'+(on?'#ffd54a':'#5d6c8e')); }
  }, 800);
})();
</script>
</body>
</html>
