<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step7 動畫 — 多工掃描（兩位數共用段線）</title>
<style>
  :root{--bg:#0b1020;--line:#263352;--text:#dce6ff;--dim:#8fa0c4;--accent:#ffd54a;--green:#38e07b;--cyan:#3ad0e6}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16213d 0%,var(--bg) 55%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .chapters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chapters button{border:1px solid var(--line);background:#121c33;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chapters button:hover{border-color:#3a4a72;background:#16223d}
  .chapters button.on{background:linear-gradient(180deg,#2a3c66,#1d2c4d);border-color:#4a6396;
    box-shadow:0 0 0 1px #4a639655,0 6px 18px #0a1228}
  .scene{background:linear-gradient(180deg,#0d1526,#0a101d);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #05080f, inset 0 1px 0 #ffffff08}
  svg{display:block;width:100%;height:auto}
  .narration{margin-top:12px;background:#0e1628;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:74px;font-size:14px;line-height:1.75}
  .narration b{color:var(--accent)}
  .narration code{background:#1a2540;padding:1px 6px;border-radius:5px;color:#ffd88a;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{background:#16223d;border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .nav .spacer{flex:1}
  .lbl{font-size:13px;fill:var(--dim)}
  .lbl-strong{font-size:15px;fill:var(--text);font-weight:600}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .chip{fill:#16233c;stroke:#3d5480;stroke-width:2}
  .plate{fill:#0d1526;stroke:#2c3a5c}
  .seg{fill:var(--accent);stroke:#ffe89a;filter:drop-shadow(0 0 6px #ffd54a)}
  .digit{opacity:.22;transition:opacity .08s}
  .digit.on{opacity:1}
  .hl-box{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
  .hl-box.on{opacity:1}
  .wire{stroke:#222e49;stroke-width:5;stroke-linecap:round;transition:stroke .1s}
  .wire.on{stroke:var(--accent);filter:drop-shadow(0 0 5px #ffd54a)}
  .big{font-size:24px;font-weight:800;fill:var(--accent);font-family:"SF Mono",Menlo,monospace;text-anchor:middle}
  .led{fill:#1b2740;stroke:#2c3a5c;transition:fill .08s}
  .led.on{fill:var(--green);stroke:#7dffb0;filter:drop-shadow(0 0 8px #38e07b)}

  /* ==== 返回主頁按鈕 ==== */
  .back-home{position:fixed;top:14px;right:18px;z-index:9999;
    display:inline-flex;align-items:center;gap:6px;
    background:#16223d;color:#dce6ff;text-decoration:none;
    padding:9px 16px;border-radius:10px;font-size:13px;
    border:1px solid #263352;font-family:inherit;
    box-shadow:0 6px 20px #05080f;transition:.2s}
  .back-home:hover{background:#1e2c4d;border-color:#4a6396;color:#fff;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>step7 動畫 — 多工掃描</h1>
  <div class="sub">
    兩位數如果「各用 7 段」需要 14 根腳，但 PMOD 只有 9 根。<br>
    解法：<b>段線共用，一次只點亮一位，快速輪流切換</b> → 靠視覺暫留看起來同時亮。
  </div>

  <div class="chapters" id="chapters">
    <button data-ch="1" class="on">① 為什麼要多工</button>
    <button data-ch="2">② 1kHz 切換</button>
    <button data-ch="3">③ 段線共用</button>
    <button data-ch="4">④ 位數交替</button>
    <button data-ch="5">⑤ 視覺暫留</button>
    <button data-ch="6">⑥ 完整</button>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a48"/><stop offset="1" stop-color="#121d33"/>
        </linearGradient>
        <g id="seg7">
          <rect class="seg" x="8" y="0"  width="44" height="7" rx="3"/>
          <rect class="seg" x="52" y="7" width="7" height="44" rx="3"/>
          <rect class="seg" x="52" y="51" width="7" height="44" rx="3"/>
          <rect class="seg" x="8" y="95" width="44" height="7" rx="3"/>
          <rect class="seg" x="1" y="51" width="7" height="44" rx="3"/>
          <rect class="seg" x="1" y="7" width="7" height="44" rx="3"/>
          <rect class="seg" x="8" y="47" width="44" height="7" rx="3"/>
        </g>
      </defs>

      <!-- 程式碼 -->
      <g id="gCode">
        <rect x="20" y="60" width="320" height="330" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="40" y="88" class="lbl-strong">step7 程式碼</text>
        <text x="40" y="116" class="mono" style="font-size:12px" fill="#9fd4ff">// 1kHz 切換</text>
        <text x="40" y="138" class="mono" style="font-size:12px" fill="#9fd4ff">always @(posedge clk12)</text>
        <text x="52" y="160" class="mono" style="font-size:12px" fill="#9fd4ff">if (refresh == 14'd11_999)</text>
        <text x="64" y="182" class="mono" style="font-size:12px" fill="#9fd4ff">cur_dig &lt;= ~cur_dig;</text>
        <text x="40" y="214" class="mono" style="font-size:12px" fill="#9fd4ff">// 段全亮 = 8</text>
        <text x="40" y="236" class="mono" style="font-size:12px" fill="#9fd4ff">assign {a..g} = 7'b1111111;</text>
        <text x="40" y="268" class="mono" style="font-size:12px" fill="#9fd4ff">// 位數交替</text>
        <text x="40" y="290" class="mono" style="font-size:12px" fill="#9fd4ff">assign dig1 = cur_dig;</text>
        <text x="40" y="312" class="mono" style="font-size:12px" fill="#9fd4ff">assign dig2 = ~cur_dig;</text>
        <text x="40" y="348" class="lbl" style="font-size:11px;fill:#ffd54a">一次只開一位 → 眼睛看起來同時亮</text>
      </g>

      <!-- FPGA -->
      <g id="gFpga">
        <rect x="370" y="60" width="230" height="330" rx="16" fill="url(#gChip)" class="chip"/>
        <text x="485" y="88" text-anchor="middle" class="lbl-strong">FPGA</text>

        <text x="390" y="124" class="lbl" style="font-size:11px">cur_dig（0/1 交替）</text>
        <rect x="390" y="134" width="60" height="36" rx="8" class="plate"/>
        <text id="curDig" x="420" y="159" class="big" style="font-size:20px">0</text>

        <text x="480" y="124" class="lbl" style="font-size:11px">refresh（1kHz）</text>
        <circle id="refLed" class="led" cx="560" cy="128" r="6"/>

        <text x="390" y="200" class="lbl" style="font-size:11px">目前打開的位數</text>
        <rect id="dig1Box" class="plate" x="390" y="212" width="60" height="24" rx="6"/>
        <text id="dig1Txt" x="420" y="229" text-anchor="middle" class="lbl" style="font-size:11px">dig1</text>
        <rect id="dig2Box" class="plate" x="470" y="212" width="60" height="24" rx="6"/>
        <text id="dig2Txt" x="500" y="229" text-anchor="middle" class="lbl" style="font-size:11px">dig2</text>

        <text x="485" y="270" text-anchor="middle" class="lbl" style="font-size:11px">段線（a~g）共用</text>
        <g id="busWires">
          <line class="wire" x1="390" y1="285" x2="560" y2="285"/>
          <line class="wire" x1="390" y1="296" x2="560" y2="296"/>
          <line class="wire" x1="390" y1="307" x2="560" y2="307"/>
          <line class="wire" x1="390" y1="318" x2="560" y2="318"/>
          <line class="wire" x1="390" y1="329" x2="560" y2="329"/>
          <line class="wire" x1="390" y1="340" x2="560" y2="340"/>
          <line class="wire" x1="390" y1="351" x2="560" y2="351"/>
        </g>
        <text x="485" y="376" text-anchor="middle" class="lbl" style="font-size:10px">7 條段線只送一次，兩邊共用</text>
      </g>

      <!-- 兩位數顯示器 -->
      <g id="gDisp">
        <rect x="640" y="60" width="430" height="330" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="855" y="88" text-anchor="middle" class="lbl-strong" style="font-size:13px">兩位數顯示器（都顯示 8）</text>

        <!-- 左邊（十位） -->
        <use href="#seg7" x="710" y="130" class="digit" id="digitL"/>
        <text x="740" y="252" text-anchor="middle" class="lbl" style="font-size:11px">十位</text>
        <rect id="digLbox" class="led" x="725" y="264" width="30" height="10" rx="4"/>

        <!-- 右邊（個位） -->
        <use href="#seg7" x="860" y="130" class="digit" id="digitR"/>
        <text x="890" y="252" text-anchor="middle" class="lbl" style="font-size:11px">個位</text>
        <rect id="digRbox" class="led" x="875" y="264" width="30" height="10" rx="4"/>

        <text id="eyeTxt" x="855" y="320" text-anchor="middle" class="lbl" style="font-size:12px;fill:#38e07b">你看起來：兩位都亮 8</text>
        <text id="seqTxt" x="855" y="350" text-anchor="middle" class="lbl" style="font-size:11px">實際：dig1 → dig2 → dig1 → …</text>
      </g>

      <rect id="hlCode" x="20" y="60" width="320" height="330" rx="14" class="hl-box"/>
      <rect id="hlFpga" x="370" y="60" width="230" height="330" rx="16" class="hl-box"/>
      <rect id="hlDisp" x="640" y="60" width="430" height="330" rx="14" class="hl-box"/>
    </svg>
  </div>

  <div class="narration" id="narr"></div>
  <div class="hint">用上方按鈕切換章節（或 ← → 鍵）。動畫會示範「快速交替、看起來同時亮」。</div>
  <div class="nav">
    <button id="prev">← 上一章</button>
    <div class="spacer"></div>
    <button id="next">下一章 →</button>
  </div>
</div>

<script>
(function(){
  const CH = 6; let cur = 1;
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  let curDig = 0;
  let fast = true;   // 快速切換（模擬 1kHz）

  function render(){
    // 哪一位現在是「開」的
    const L = (curDig === 0);   // 十位
    $('#digitL').classList.toggle('on', L);
    $('#digitR').classList.toggle('on', !L);
    $('#curDig').textContent = curDig;
    $('#digLbox').classList.toggle('on', L);
    $('#digRbox').classList.toggle('on', !L);
    $('#dig1Txt').textContent = L ? 'dig1 開' : 'dig1 關';
    $('#dig2Txt').textContent = L ? 'dig2 關' : 'dig2 開';
    // bus 線亮
    $$('#busWires line').forEach(l=>l.classList.toggle('on', true));
  }

  function setChapter(n){
    cur = Math.max(1,Math.min(CH,n));
    $$('#chapters button').forEach(b=>b.classList.toggle('on', +b.dataset.ch===cur));
    $$('.hl-box').forEach(e=>e.classList.remove('on'));
    if(cur>=1) $('#hlCode').classList.add('on');
    if(cur>=2) $('#hlFpga').classList.add('on');
    if(cur>=3) $('#hlDisp').classList.add('on');
    // 第 1 章：慢速示範（看得出來交替）；第 2 章後：快速
    fast = (cur >= 2);
    if(cur === 1){
      $('#eyeTxt').textContent = '慢速示範：你可以看到一位一位閃';
      $('#seqTxt').textContent = '實際：dig1 ↔ dig2 慢慢切';
    } else {
      $('#eyeTxt').textContent = '你看起來：兩位都亮 8';
      $('#seqTxt').textContent = '實際：dig1 → dig2 → dig1 → …（每秒 1000 次）';
    }
    $('#narr').innerHTML = narrative[cur];
  }

  const narrative = {
    1: `<b>① 為什麼要多工</b>：兩位數若「各用 7 段」需要 <b>14 根腳</b>，
        PMOD 只有 9 根，根本不夠。所以改成「段線共用 + 位數分時」。
        現在是慢速示範，你可以看到兩位輪流閃。`,
    2: `<b>② 1kHz 切換</b>：<code>refresh</code> 計數器數到 11,999 → 12MHz ÷ 12,000 = <b>1kHz</b>，
        每 1 毫秒切換一次位數。`,
    3: `<b>③ 段線共用</b>：7 條段線（a~g）只送一次，兩位數共用同一組。
        所以總共只要 <b>7 + 2 = 9 根腳</b>，剛好塞進 PMOD。`,
    4: `<b>④ 位數交替</b>：<code>dig1 = cur_dig</code>、<code>dig2 = ~cur_dig</code>，
        永遠一開一關，所以同一時間只有一位在亮。`,
    5: `<b>⑤ 視覺暫留</b>：1kHz 對眼睛來說太快了（人眼約 60Hz 就覺得連續），
        所以雖然實際上是「輪流亮」，你看起來像<b>兩位同時亮</b>。`,
    6: `<b>⑥ 完整</b>：這就是為什麼「兩位數只要 9 根腳」。step8 會把這個技巧
        加上「0~99 計數」，變成真正的兩位數計數器。`
  };

  // 切換位數：固定 90ms tick，靠 fast 決定每幾 tick 切一次
  let tickCount = 0;
  setInterval(()=>{
    tickCount++;
    const period = fast ? 1 : 8;   // 快速：每 tick 切；慢速：每 8 tick 切
    if(tickCount % period === 0){
      curDig = curDig ? 0 : 1;
      render();
    }
  }, 90);

  $$('#chapters button').forEach(b=>b.addEventListener('click', ()=>setChapter(+b.dataset.ch)));
  $('#prev').addEventListener('click', ()=>setChapter(cur-1));
  $('#next').addEventListener('click', ()=>setChapter(cur+1));
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') setChapter(cur-1);
    if(e.key==='ArrowRight') setChapter(cur+1);
  });

  const params = new URLSearchParams(location.search);
  const start = parseInt(params.get('ch')||'1',10);
  setChapter(isNaN(start)?1:start);
  render();
})();
</script>
<a href="index.html" class="back-home">← 返回主頁</a>
</body>
</html>
