<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step3 動畫 — 逐腳掃描找腳位</title>
<style>
  :root{
    --bg:#0b1020; --panel:#0f1729; --line:#263352;
    --text:#dce6ff; --dim:#8fa0c4; --accent:#ffd54a;
    --green:#38e07b; --cyan:#3ad0e6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16213d 0%,var(--bg) 55%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .chapters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chapters button{border:1px solid var(--line);background:#121c33;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chapters button:hover{border-color:#3a4a72;background:#16223d}
  .chapters button.on{background:linear-gradient(180deg,#2a3c66,#1d2c4d);border-color:#4a6396;
    box-shadow:0 0 0 1px #4a639655,0 6px 18px #0a1228}
  .scene{background:linear-gradient(180deg,#0d1526,#0a101d);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #05080f, inset 0 1px 0 #ffffff08}
  svg{display:block;width:100%;height:auto}
  .narration{margin-top:12px;background:#0e1628;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:74px;font-size:14px;line-height:1.75}
  .narration b{color:var(--accent)}
  .narration code{background:#1a2540;padding:1px 6px;border-radius:5px;color:#ffd88a;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{background:#16223d;border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .nav button:hover{background:#1e2c4d;border-color:#3a4a72}
  .nav .spacer{flex:1}
  .lbl{font-size:13px;fill:var(--dim)}
  .lbl-strong{font-size:15px;fill:var(--text);font-weight:600}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .chip{fill:#16233c;stroke:#3d5480;stroke-width:2}
  .pin{fill:#0d1526;stroke:#3d5480;stroke-width:1.5;transition:fill .15s,stroke .15s}
  .pin.on{fill:#123a2a;stroke:var(--green);filter:drop-shadow(0 0 6px #38e07b)}
  .pin-txt{font-size:11px;fill:#9fb2d8;text-anchor:middle;font-family:"SF Mono",Menlo,monospace}
  .pin.on .pin-txt{fill:#7dffb0}
  .wire{stroke:#222e49;stroke-width:6;stroke-linecap:round;transition:stroke .15s}
  .wire.on{stroke:var(--accent);filter:drop-shadow(0 0 6px #ffd54a)}
  .seg{fill:#1b2740;stroke:#2c3a5c;stroke-width:1.5;transition:fill .18s,filter .18s}
  .seg.lit{fill:var(--accent);stroke:#ffe89a;filter:drop-shadow(0 0 10px #ffd54a)}
  .dig{fill:#0d1526;stroke:#3d5480;stroke-width:1.5;transition:all .15s}
  .dig.on{fill:#123a2a;stroke:var(--green);filter:drop-shadow(0 0 6px #38e07b)}
  .hl-box{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
  .hl-box.on{opacity:1}
  .big{font-size:24px;font-weight:700;fill:var(--accent);font-family:"SF Mono",Menlo,monospace}
  .plate{fill:#0d1526;stroke:#2c3a5c}

  /* ==== 返回主頁按鈕 ==== */
  .back-home{position:fixed;top:14px;right:18px;z-index:9999;
    display:inline-flex;align-items:center;gap:6px;
    background:#16223d;color:#dce6ff;text-decoration:none;
    padding:9px 16px;border-radius:10px;font-size:13px;
    border:1px solid #263352;font-family:inherit;
    box-shadow:0 6px 20px #05080f;transition:.2s}
  .back-home:hover{background:#1e2c4d;border-color:#4a6396;color:#fff;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>step3 動畫 — 逐腳掃描找腳位</h1>
  <div class="sub">
    當你不知道「PMOD 的 p1 對應哪個腳」時，就讓 9 個腳**輪流變高**，一次只亮一個，再對照顯示器。<br>
    路徑：<b>step 0~9 → 只有一個 p 腳是 1 → 對應的段亮 → 記下對照關係</b>
  </div>

  <div class="chapters" id="chapters">
    <button data-ch="1" class="on">① 為什麼要掃描</button>
    <button data-ch="2">② 9 個輸出腳</button>
    <button data-ch="3">③ step 計數</button>
    <button data-ch="4">④ 只有一個是 1</button>
    <button data-ch="5">⑤ 觀察對應</button>
    <button data-ch="6">⑥ 得出對照表</button>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a48"/><stop offset="1" stop-color="#121d33"/>
        </linearGradient>
      </defs>

      <!-- ===== 程式碼面板 ===== -->
      <g id="gCode">
        <rect x="20" y="60" width="270" height="330" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="40" y="88" class="lbl-strong">step3 程式碼</text>
        <text x="40" y="116" class="mono" style="font-size:12px" fill="#9fd4ff">assign p1 = (step == 1);</text>
        <text x="40" y="138" class="mono" style="font-size:12px" fill="#9fd4ff">assign p2 = (step == 2);</text>
        <text x="40" y="160" class="mono" style="font-size:12px" fill="#9fd4ff">assign p3 = (step == 3);</text>
        <text x="40" y="182" class="mono" style="font-size:12px" fill="#9fd4ff">...</text>
        <text x="40" y="204" class="mono" style="font-size:12px" fill="#9fd4ff">assign p9 = (step == 9);</text>
        <text x="40" y="240" class="mono" style="font-size:12px" fill="#8fa0c4">// step 每秒 +1（0~9）</text>
        <text x="40" y="262" class="mono" style="font-size:12px" fill="#8fa0c4">// 同一時間只有一個 p 腳是 1</text>
        <text x="40" y="300" class="lbl" style="font-size:11px">PN：這個腳是高電位時，</text>
        <text x="40" y="318" class="lbl" style="font-size:11px">     顯示器哪一段會亮？</text>
        <text x="40" y="350" class="lbl" style="font-size:11px;fill:#ffd54a">→ 逐一記下來就是對照表</text>
      </g>

      <!-- ===== FPGA ===== -->
      <g id="gFpga">
        <rect x="310" y="60" width="180" height="400" rx="16" fill="url(#gChip)" class="chip"/>
        <text x="400" y="90" text-anchor="middle" class="lbl-strong">FPGA</text>
        <text x="400" y="110" text-anchor="middle" class="lbl" style="font-size:11px">iCE40UP5K</text>

        <!-- step 計數器 -->
        <text x="330" y="146" class="lbl" style="font-size:11px">step</text>
        <rect x="370" y="126" width="66" height="36" rx="8" class="plate"/>
        <text id="stepNum" x="403" y="152" text-anchor="middle" class="big">0</text>

        <!-- 9 個輸出腳 -->
        <g id="pins">
          <g id="pin1"><rect class="pin" x="490" y="180" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="196">p1</text></g>
          <g id="pin2"><rect class="pin" x="490" y="212" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="228">p2</text></g>
          <g id="pin3"><rect class="pin" x="490" y="244" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="260">p3</text></g>
          <g id="pin4"><rect class="pin" x="490" y="276" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="292">p4</text></g>
          <g id="pin5"><rect class="pin" x="490" y="308" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="324">p5</text></g>
          <g id="pin6"><rect class="pin" x="490" y="340" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="356">p6</text></g>
          <g id="pin7"><rect class="pin" x="490" y="372" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="388">p7</text></g>
          <g id="pin8"><rect class="pin" x="490" y="404" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="420">p8</text></g>
          <g id="pin9"><rect class="pin" x="490" y="436" width="46" height="22" rx="5"/><text class="pin-txt" x="513" y="452">p9</text></g>
        </g>
      </g>

      <!-- ===== PMOD 9 條線 ===== -->
      <g id="gPmod">
        <rect x="560" y="60" width="150" height="400" rx="12" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="635" y="90" text-anchor="middle" class="lbl-strong" style="font-size:13px">PMOD 排線</text>

        <line id="w1" class="wire" x1="580" y1="191" x2="690" y2="191"/>
        <line id="w2" class="wire" x1="580" y1="223" x2="690" y2="223"/>
        <line id="w3" class="wire" x1="580" y1="255" x2="690" y2="255"/>
        <line id="w4" class="wire" x1="580" y1="287" x2="690" y2="287"/>
        <line id="w5" class="wire" x1="580" y1="319" x2="690" y2="319"/>
        <line id="w6" class="wire" x1="580" y1="351" x2="690" y2="351"/>
        <line id="w7" class="wire" x1="580" y1="383" x2="690" y2="383"/>
        <line id="w8" class="wire" x1="580" y1="415" x2="690" y2="415"/>
        <line id="w9" class="wire" x1="580" y1="447" x2="690" y2="447"/>
        <text x="635" y="120" text-anchor="middle" class="lbl" style="font-size:10px">9 條訊號線</text>
        <text id="obsTxt" x="635" y="470" text-anchor="middle" class="lbl" style="font-size:11px;fill:#ffd54a">（觀察中）</text>
      </g>

      <!-- ===== 7 段顯示器 ===== -->
      <g id="gDisp">
        <rect x="740" y="60" width="170" height="400" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="825" y="90" text-anchor="middle" class="lbl-strong" style="font-size:13px">7 段顯示器</text>

        <g id="segs">
          <rect id="segA" class="seg" x="790" y="130" width="70" height="10" rx="3"/>
          <rect id="segB" class="seg" x="860" y="140" width="10" height="70" rx="3"/>
          <rect id="segC" class="seg" x="860" y="220" width="10" height="70" rx="3"/>
          <rect id="segD" class="seg" x="790" y="290" width="70" height="10" rx="3"/>
          <rect id="segE" class="seg" x="780" y="220" width="10" height="70" rx="3"/>
          <rect id="segF" class="seg" x="780" y="140" width="10" height="70" rx="3"/>
          <rect id="segG" class="seg" x="790" y="210" width="70" height="10" rx="3"/>
        </g>

        <!-- 位數腳 -->
        <rect id="digBox1" class="dig" x="790" y="330" width="30" height="12" rx="4"/>
        <text x="805" y="356" text-anchor="middle" class="lbl" style="font-size:10px">dig1</text>
        <rect id="digBox2" class="dig" x="830" y="330" width="30" height="12" rx="4"/>
        <text x="845" y="356" text-anchor="middle" class="lbl" style="font-size:10px">dig2</text>

        <text id="obsSeg" x="825" y="400" text-anchor="middle" class="lbl" style="font-size:12px">—</text>
      </g>

      <!-- 高亮框 -->
      <rect id="hlCode" x="20" y="60" width="270" height="330" rx="14" class="hl-box"/>
      <rect id="hlFpga" x="310" y="60" width="180" height="400" rx="16" class="hl-box"/>
      <rect id="hlPmod" x="560" y="60" width="150" height="400" rx="12" class="hl-box"/>
      <rect id="hlDisp" x="740" y="60" width="170" height="400" rx="14" class="hl-box"/>
    </svg>
  </div>

  <div class="narration" id="narr"></div>
  <div class="hint">用上方按鈕切換章節（或 ← → 鍵）。動畫每秒掃一個腳。</div>
  <div class="nav">
    <button id="prev">← 上一章</button>
    <div class="spacer"></div>
    <button id="next">下一章 →</button>
  </div>
</div>

<script>
(function(){
  const CH = 6;
  let cur = 1;
  const $  = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  // 實測的腳位對照（p1..p9 → 段/位數）
  const MAP = {
    1: {type:'seg', id:'segA', name:'a'},
    2: {type:'seg', id:'segB', name:'b'},
    3: {type:'seg', id:'segC', name:'c'},
    4: {type:'seg', id:'segE', name:'e'},
    5: {type:'dig', id:'digBox2', name:'位數腳 dig2'},
    6: {type:'seg', id:'segD', name:'d'},
    7: {type:'seg', id:'segG', name:'g'},
    8: {type:'dig', id:'digBox1', name:'位數腳 dig1'},
    9: {type:'seg', id:'segF', name:'f'},
  };
  const FP_PIN = {1:42,2:43,3:44,4:45,5:46,6:47,7:48,8:2,9:3}; // 對照用

  let step = 0;

  function clearAll(){
    for(let i=1;i<=9;i++){ $('#pin'+i).classList.remove('on'); $('#w'+i).classList.remove('on'); }
    $$('#segs .seg').forEach(s=>s.classList.remove('lit'));
    $('#digBox1').classList.remove('on');
    $('#digBox2').classList.remove('on');
  }

  function render(){
    clearAll();
    $('#stepNum').textContent = step;

    if(step >= 1 && step <= 9){
      $('#pin'+step).classList.add('on');
      $('#w'+step).classList.add('on');

      const m = MAP[step];
      if(m.type === 'seg'){
        $('#'+m.id).classList.add('lit');
        $('#obsTxt').textContent = 'p' + step + '（pin ' + FP_PIN[step] + '）高電位 → ' + m.name + ' 段亮';
        $('#obsSeg').textContent = m.name + ' 段亮';
      } else {
        $('#'+m.id).classList.add('on');
        $('#obsTxt').textContent = 'p' + step + '（pin ' + FP_PIN[step] + '）高電位 → 位數腳！沒段亮';
        $('#obsSeg').textContent = '沒段亮（位數腳）';
      }
    } else {
      $('#obsTxt').textContent = '（全低 → 沒東西亮）';
      $('#obsSeg').textContent = '—';
    }
  }

  function setChapter(n){
    cur = Math.max(1, Math.min(CH, n));
    $$('#chapters button').forEach(b=>b.classList.toggle('on', +b.dataset.ch === cur));
    $$('.hl-box').forEach(el=>el.classList.remove('on'));
    if(cur >= 1) $('#hlCode').classList.add('on');
    if(cur >= 2) $('#hlFpga').classList.add('on');
    if(cur >= 5) $('#hlPmod').classList.add('on');
    if(cur >= 5) $('#hlDisp').classList.add('on');
    $('#narr').innerHTML = narrative[cur];
  }

  const narrative = {
    1: `<b>① 為什麼要掃描</b>：PMOD 有 9 個腳，但你不知道哪個是 a、哪個是 b，
        也不知道有沒有「位數腳」。所以用最笨但最可靠的方法：<b>一次只拉高一隻腳，看哪一段亮</b>。`,
    2: `<b>② 9 個輸出腳</b>：程式把 p1~p9 全部拉出來，各自接到 FPGA 的一個腳位
        （p1=42、p2=43、p3=44、p4=45、p5=46、p6=47、p7=48、p8=2、p9=3）。`,
    3: `<b>③ step 計數</b>：一個「每秒 +1」的計數器，範圍 0~9（0 是「全部低」，休息用）。`,
    4: `<b>④ 只有一個是 1</b>：<code>assign p1 = (step == 1);</code> 這種寫法，
        任何時刻<b>只有一個 p 腳是 1</b>，其餘都是 0。所以不會互相干擾。`,
    5: `<b>⑤ 觀察對應</b>：當某個 p 腳是 1，就看顯示器哪一段亮。
        例如 p1 亮 → a 段亮，代表 <b>p1 就是 a</b>。若沒段亮，就是位數腳。`,
    6: `<b>⑥ 得出對照表</b>：p1→a、p2→b、p3→c、p4→e、p5→位數、p6→d、p7→g、p8→位數、p9→f。
        這就是本專案當初用 <code>diag9</code> 實測出來的結果（也是有名的「PMOD 標示是反的」發現過程）。`
  };

  // 每秒掃一個腳（教學用 650ms）
  setInterval(()=>{ step = (step + 1) % 10; render(); }, 650);

  $$('#chapters button').forEach(b=>b.addEventListener('click', ()=>setChapter(+b.dataset.ch)));
  $('#prev').addEventListener('click', ()=>setChapter(cur-1));
  $('#next').addEventListener('click', ()=>setChapter(cur+1));
  document.addEventListener('keydown', e=>{
    if(e.key === 'ArrowLeft')  setChapter(cur-1);
    if(e.key === 'ArrowRight') setChapter(cur+1);
  });

  const params = new URLSearchParams(location.search);
  const start = parseInt(params.get('ch') || '1', 10);
  setChapter(isNaN(start) ? 1 : start);
  render();
})();
</script>
<a href="index.html" class="back-home">← 返回主頁</a>
</body>
</html>
