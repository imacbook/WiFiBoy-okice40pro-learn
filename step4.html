<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step4 動畫 — 解碼器（數字 → 段碼）</title>
<style>
  :root{--bg:#0b1020;--line:#263352;--text:#dce6ff;--dim:#8fa0c4;--accent:#ffd54a;--green:#38e07b;--cyan:#3ad0e6}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16213d 0%,var(--bg) 55%);
       color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:19px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.6}
  .chapters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chapters button{border:1px solid var(--line);background:#121c33;color:var(--text);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chapters button:hover{border-color:#3a4a72;background:#16223d}
  .chapters button.on{background:linear-gradient(180deg,#2a3c66,#1d2c4d);border-color:#4a6396;
    box-shadow:0 0 0 1px #4a639655,0 6px 18px #0a1228}
  .scene{background:linear-gradient(180deg,#0d1526,#0a101d);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;box-shadow:0 20px 60px #05080f, inset 0 1px 0 #ffffff08}
  svg{display:block;width:100%;height:auto}
  .narration{margin-top:12px;background:#0e1628;border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;min-height:74px;font-size:14px;line-height:1.75}
  .narration b{color:var(--accent)}
  .narration code{background:#1a2540;padding:1px 6px;border-radius:5px;color:#ffd88a;font-size:13px}
  .hint{color:var(--dim);font-size:12px;margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:12px}
  .nav button{background:#16223d;border:1px solid var(--line);color:var(--text);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit}
  .nav .spacer{flex:1}
  .lbl{font-size:13px;fill:var(--dim)}
  .lbl-strong{font-size:15px;fill:var(--text);font-weight:600}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
  .chip{fill:#16233c;stroke:#3d5480;stroke-width:2}
  .plate{fill:#0d1526;stroke:#2c3a5c}
  .seg{fill:#1b2740;stroke:#2c3a5c;stroke-width:1.5;transition:fill .2s,filter .2s}
  .pwire{fill:#222e49;transition:fill .15s,filter .15s}
  .pwire.on{fill:var(--accent);filter:drop-shadow(0 0 6px #ffd54a)}
  .seg.lit{fill:var(--accent);stroke:#ffe89a;filter:drop-shadow(0 0 10px #ffd54a)}
  .hl-box{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:6 5;opacity:0;transition:opacity .3s}
  .hl-box.on{opacity:1}
  .bit{font-family:"SF Mono",Menlo,monospace;font-size:14px;fill:#9fd4ff}
  .bit.on{fill:var(--accent);font-weight:700}
  .big{font-size:30px;font-weight:800;fill:var(--accent);font-family:"SF Mono",Menlo,monospace;text-anchor:middle}

  /* ==== 返回主頁按鈕 ==== */
  .back-home{position:fixed;top:14px;right:18px;z-index:9999;
    display:inline-flex;align-items:center;gap:6px;
    background:#16223d;color:#dce6ff;text-decoration:none;
    padding:9px 16px;border-radius:10px;font-size:13px;
    border:1px solid #263352;font-family:inherit;
    box-shadow:0 6px 20px #05080f;transition:.2s}
  .back-home:hover{background:#1e2c4d;border-color:#4a6396;color:#fff;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <h1>step4 動畫 — 解碼器（數字 → 段碼）</h1>
  <div class="sub">
    一個 4-bit 數字，怎麼變成「7 段亮暗」？靠一個 <code>case</code> 查表（解碼器）。<br>
    路徑：<b>數字 → 解碼器 case 查表 → 7-bit 段碼 → 顯示器</b>
  </div>

  <div class="chapters" id="chapters">
    <button data-ch="1" class="on">① 問題</button>
    <button data-ch="2">② case 查表</button>
    <button data-ch="3">③ 段碼怎麼看</button>
    <button data-ch="4">④ 模組實例化</button>
    <button data-ch="5">⑤ 位數致能</button>
    <button data-ch="6">⑥ 完整</button>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 530" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gChip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a48"/><stop offset="1" stop-color="#121d33"/>
        </linearGradient>
      </defs>

      <!-- 程式碼面板 -->
      <g id="gCode">
        <rect x="20" y="60" width="320" height="360" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="40" y="88" class="lbl-strong">step4 程式碼（解碼器）</text>
        <text x="40" y="116" class="mono" style="font-size:12px" fill="#9fd4ff">always @* begin</text>
        <text x="52" y="138" class="mono" style="font-size:12px" fill="#9fd4ff">case (digit)</text>
        <text x="64" y="160" class="mono" style="font-size:12px" fill="#9fd4ff">4'd0: seg = 7'b1111110;</text>
        <text x="64" y="182" class="mono" style="font-size:12px" fill="#9fd4ff">4'd1: seg = 7'b0110000;</text>
        <text x="64" y="204" class="mono" style="font-size:12px" fill="#9fd4ff">...</text>
        <text x="64" y="226" class="mono" style="font-size:12px" fill="#9fd4ff">4'd9: seg = 7'b1111011;</text>
        <text x="52" y="248" class="mono" style="font-size:12px" fill="#9fd4ff">endcase</text>
        <text x="40" y="270" class="mono" style="font-size:12px" fill="#9fd4ff">end</text>

        <line x1="40" y1="284" x2="320" y2="284" stroke="#2c3a5c"/>

        <text x="40" y="308" class="lbl" style="font-size:11px">// 把解碼器接進來：</text>
        <text x="40" y="330" class="mono" style="font-size:11px" fill="#9fd4ff">seven_seg_decoder dec(</text>
        <text x="52" y="350" class="mono" style="font-size:11px" fill="#9fd4ff">.digit(4'd3), .seg(seg));</text>
        <text x="40" y="378" class="lbl" style="font-size:11px">// 固定餵 3，只開右邊一位</text>
        <text x="40" y="400" class="mono" style="font-size:11px" fill="#9fd4ff">dig1=0; dig2=1;</text>
      </g>

      <!-- FPGA -->
      <g id="gFpga">
        <rect x="370" y="60" width="210" height="360" rx="16" fill="url(#gChip)" class="chip"/>
        <text x="475" y="90" text-anchor="middle" class="lbl-strong">FPGA</text>
        <text x="475" y="110" text-anchor="middle" class="lbl" style="font-size:11px">iCE40UP5K</text>

        <!-- 輸入 digit -->
        <text x="395" y="146" class="lbl" style="font-size:11px">輸入 digit</text>
        <rect x="510" y="126" width="50" height="32" rx="6" class="plate"/>
        <text id="inNum" x="535" y="150" class="big" style="font-size:22px">3</text>

        <!-- 解碼器方塊 -->
        <rect x="390" y="175" width="170" height="110" rx="10" fill="#0d1526" stroke="#3a4a72" stroke-width="1.5"/>
        <text x="475" y="196" text-anchor="middle" class="lbl" style="font-size:11px">解碼器 case 查表</text>
        <text id="inBits" x="475" y="222" text-anchor="middle" class="bit" style="font-size:13px">digit = 0011</text>
        <text x="475" y="245" text-anchor="middle" class="lbl" style="font-size:11px">↓</text>
        <text id="outBits" x="475" y="270" text-anchor="middle" class="bit" style="font-size:13px;fill:#ffd54a">seg = 1111001</text>

        <!-- 段碼對照 -->
        <text x="395" y="316" class="lbl" style="font-size:10px">a b c d e f g</text>
        <text id="segBits" x="475" y="336" text-anchor="middle" class="bit" style="font-size:13px;fill:#9fd4ff">1 1 1 1 0 0 1</text>

        <!-- 輸出腳 -->
        <text x="475" y="372" text-anchor="middle" class="lbl" style="font-size:11px">→ 輸出到 a~g 腳</text>
        <text x="475" y="396" text-anchor="middle" class="lbl" style="font-size:11px">dig1=0（右亮） dig2=1</text>
      </g>

      <!-- 7 段顯示器 -->
      <g id="gDisp">
        <rect x="650" y="60" width="200" height="360" rx="14" fill="#0c1424" stroke="#2c3a5c" stroke-width="1.5"/>
        <text x="750" y="88" text-anchor="middle" class="lbl-strong" style="font-size:13px">7 段顯示器</text>
        <g id="segs">
          <rect id="segA" class="seg" x="715" y="135" width="70" height="10" rx="3"/>
          <rect id="segB" class="seg" x="785" y="145" width="10" height="70" rx="3"/>
          <rect id="segC" class="seg" x="785" y="225" width="10" height="70" rx="3"/>
          <rect id="segD" class="seg" x="715" y="295" width="70" height="10" rx="3"/>
          <rect id="segE" class="seg" x="705" y="225" width="10" height="70" rx="3"/>
          <rect id="segF" class="seg" x="705" y="145" width="10" height="70" rx="3"/>
          <rect id="segG" class="seg" x="715" y="215" width="70" height="10" rx="3"/>
        </g>
        <text id="digitLbl" x="750" y="332" text-anchor="middle" class="lbl" style="font-size:12px">顯示：3</text>
        <rect id="digBox1" class="plate" x="715" y="346" width="30" height="12" rx="4"/>
        <text x="730" y="372" text-anchor="middle" class="lbl" style="font-size:10px">dig1</text>
        <rect id="digBox2" class="plate" x="760" y="346" width="30" height="12" rx="4"/>
        <text x="775" y="372" text-anchor="middle" class="lbl" style="font-size:10px">dig2</text>
      </g>

      <rect id="hlCode" x="20" y="60" width="320" height="360" rx="14" class="hl-box"/>
      <rect id="hlFpga" x="370" y="60" width="210" height="360" rx="16" class="hl-box"/>
      <rect id="hlDisp" x="650" y="60" width="200" height="360" rx="14" class="hl-box"/>
    
      <!-- ==== PMOD 訊號列（有訊號的線會亮） ==== -->
      <g id="gPmod">
        <text x="550" y="478" text-anchor="middle" class="lbl" style="font-size:11px">PMOD 排線（有訊號的線會亮）</text>
        <g id="pmodRow">
          <rect id="pa" class="pwire" x="210" y="490" width="95" height="11" rx="3"/>
          <text x="257" y="516" text-anchor="middle" class="lbl" style="font-size:9px">a</text>
          <rect id="pb" class="pwire" x="315" y="490" width="95" height="11" rx="3"/>
          <text x="362" y="516" text-anchor="middle" class="lbl" style="font-size:9px">b</text>
          <rect id="pc" class="pwire" x="420" y="490" width="95" height="11" rx="3"/>
          <text x="467" y="516" text-anchor="middle" class="lbl" style="font-size:9px">c</text>
          <rect id="pd" class="pwire" x="525" y="490" width="95" height="11" rx="3"/>
          <text x="572" y="516" text-anchor="middle" class="lbl" style="font-size:9px">d</text>
          <rect id="pe" class="pwire" x="630" y="490" width="95" height="11" rx="3"/>
          <text x="677" y="516" text-anchor="middle" class="lbl" style="font-size:9px">e</text>
          <rect id="pf" class="pwire" x="735" y="490" width="95" height="11" rx="3"/>
          <text x="782" y="516" text-anchor="middle" class="lbl" style="font-size:9px">f</text>
          <rect id="pg" class="pwire" x="840" y="490" width="95" height="11" rx="3"/>
          <text x="887" y="516" text-anchor="middle" class="lbl" style="font-size:9px">g</text>
        </g>
      </g>
    </svg>
  </div>

  <div class="narration" id="narr"></div>
  <div class="hint">用上方按鈕切換章節（或 ← → 鍵）。數字每 1.2 秒換一個。</div>
  <div class="nav">
    <button id="prev">← 上一章</button>
    <div class="spacer"></div>
    <button id="next">下一章 →</button>
  </div>
</div>

<script>
(function(){
  const CH = 6; let cur = 1;
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  // 解碼表：0~9 → 7-bit 段碼
  const CODE = ['1111110','0110000','1101101','1111001','0110011',
                '1011011','1011111','1110000','1111111','1111011'];
  const SEG_IDS = ['segA','segB','segC','segD','segE','segF','segG'];
  let digit = 3;

  
  // 更新 PMOD 訊號列（code = 'a b c d e f g' 的 7-bit 字串）
  function updatePmod(code){
    const ids = ['pa','pb','pc','pd','pe','pf','pg'];
    ids.forEach((id,i)=> $('#'+id).classList.toggle('on', code && code[i]==='1'));
  }

  function render(){
    const code = CODE[digit];
    // 點亮對應段（code[0]=a ... code[6]=g）
    SEG_IDS.forEach((id,i)=> $('#'+id).classList.toggle('lit', code[i]==='1'));
    // 數字與字串
    $('#inNum').textContent = digit;
    $('#inBits').textContent = 'digit = ' + digit.toString(2).padStart(4,'0');
    $('#outBits').textContent = 'seg = ' + code;
    $('#segBits').textContent = code.split('').join(' ');
    $('#digitLbl').textContent = '顯示：' + digit;
    $('#digBox1').classList.remove('on');
    updatePmod(code);
  }

  function setChapter(n){
    cur = Math.max(1,Math.min(CH,n));
    $$('#chapters button').forEach(b=>b.classList.toggle('on', +b.dataset.ch===cur));
    $$('.hl-box').forEach(e=>e.classList.remove('on'));
    if(cur>=1) $('#hlCode').classList.add('on');
    if(cur>=3) $('#hlFpga').classList.add('on');
    if(cur>=4) $('#hlDisp').classList.add('on');
    $('#narr').innerHTML = narrative[cur];
  }

  const narrative = {
    1: `<b>① 問題</b>：電腦只懂 0/1，但我們想顯示「3」。
        所以要有一個對照表：把 4-bit 數字（0011）翻成 7 段亮暗（1111001）。這個對照表就是<b>解碼器</b>。`,
    2: `<b>② case 查表</b>：<code>case (digit)</code> 把 0~9 一個一個列出來，
        每個對應一組段碼。這是最直覺、最好懂的寫法（也是一種 ROM 查表）。`,
    3: `<b>③ 段碼怎麼看</b>：<code>7'b1111110</code> 從左到右是 a,b,c,d,e,f,g，
        <b>1 = 亮</b>。所以 <code>1111110</code> = a~f 亮、g 暗 = 「0」；
        <code>1111001</code> = a,b,c,d,g 亮 = 「3」。`,
    4: `<b>④ 模組實例化</b>：<code>seven_seg_decoder dec(.digit(4'd3), .seg(seg));</code>
        把解碼器「接進來」，輸入固定給 3，輸出接到 <code>seg</code>。`,
    5: `<b>⑤ 位數致能</b>：<code>dig1=0</code>（共陰：0 = 啟用右邊一位）、
        <code>dig2=1</code>（關閉左邊）。`,
    6: `<b>⑥ 完整</b>：數字 → 解碼器（case 查表）→ 7-bit 段碼 → a~g 腳 → 顯示器。
        所以你會看到右邊一位顯示對應的數字（動畫會循環 0~9）。`
  };

  setInterval(()=>{ digit = (digit+1) % 10; render(); }, 1200);

  $$('#chapters button').forEach(b=>b.addEventListener('click', ()=>setChapter(+b.dataset.ch)));
  $('#prev').addEventListener('click', ()=>setChapter(cur-1));
  $('#next').addEventListener('click', ()=>setChapter(cur+1));
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft') setChapter(cur-1);
    if(e.key==='ArrowRight') setChapter(cur+1);
  });

  const params = new URLSearchParams(location.search);
  const start = parseInt(params.get('ch')||'1',10);
  setChapter(isNaN(start)?1:start);
  render();
})();
</script>
<a href="index.html" class="back-home">← 返回主頁</a>
</body>
</html>
